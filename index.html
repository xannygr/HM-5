<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Hero</title>
</head>
<body>
    <header class="header">
        <img src="./assets/img/LOGO (1).svg" alt="LOGO">
        <nav class="menu">
            <ul>
                <li id="home">Home</li>
                <li>Episodes</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
    <section class="section-wrapper">
        <img src="./assets/img/IMAGE (1).png" alt="hero-image">
        <div class="text-wrapper"> 
            <h1 class="title">Take your podcast to the next <span class="title-span">level</span></h1>
            <div class="subtitle-wrapper"> 
                <span class="subtitle"> Listen on </span> 
                <div class="icons-wrapper">
                    <img class="icons" src="./assets/img/IMAGE.svg" alt="">
                    <img class="icons" src="./assets/img/IMAGE-1.svg" alt="">
                    <img class="icons" src="./assets/img/IMAGE-2.svg" alt="">
                    <img class="icons" src="./assets/img/IMAGE-3.svg" alt="">
                    <img class="icons" src="./assets/img/IMAGE-4.svg" alt="">
                    
                </div>
            </div>
            
        </div>
    </section>
</body>
</html>
